name: Production health

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-health
  cancel-in-progress: true

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check Laravel application and database
        shell: bash
        run: |
          health="$(curl --fail --silent --show-error --retry 2 --max-time 20 https://emumtaz.ismp.my/health)"
          jq -e '.status == "ok" and .database == "connected" and .schema == "ready" and (.responseTimeMs | type == "number")' <<< "$health"
